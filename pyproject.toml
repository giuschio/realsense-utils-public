[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realsense_utils2"
version = "0.1.0"
description = "Utilities for Intel RealSense workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Your Name" }
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
camera = [
  "pyrealsense2",
]
depth-model = [
  "torch",
]
foundation-stereo = [
  "torch",
  "timm",
  "einops",
  "omegaconf",
  "scipy",
  "scikit-image",
  "opencv-contrib-python",
  "imageio",
  "pyyaml",
]
visualization = [
  "open3d",
]
all = [
  "pyrealsense2",
  "torch",
  "timm",
  "einops",
  "omegaconf",
  "scipy",
  "scikit-image",
  "opencv-contrib-python",
  "imageio",
  "pyyaml",
  "open3d",
]

[project.urls]
Homepage = "https://github.com/giuschio/realsense-utils-public"
Repository = "https://github.com/giuschio/realsense-utils-public"
Issues = "https://github.com/giuschio/realsense-utils-public/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
